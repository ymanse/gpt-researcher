# search-quality.yaml — gralph profile: deep_tree_research search-quality upgrade.
#
# Graph: s0-bench -> (s1..s5: red -> impl -> review -> measure) -> s6-benchmark
#        -> harness-audit -> DONE
#   red     = RED integrity (tests collect AND fail; hashes + base_sha recorded)
#   impl    = GREEN anti-tamper, recomputed IN-GATE by verify_impl.py (hash re-check,
#             stage + full cumulative suite, ruff on changed files, bench freeze)
#   review  = SEPARATE-LANE adversarial reviewer (gets ONLY git diff + spec conditions;
#             blocking findings route back to impl, max 3 rounds)
#   measure = live container measurement (measure.py), thresholds from observed defects
#   s6      = all-5-golden benchmark vs the FROZEN firecrawl baseline; below-baseline
#             metrics route back to the owning stage's impl (max 3 rounds)
#   audit   = audits the gates themselves (law 6 try matrix, score-tamper git log,
#             law 10 regen idempotence, law 8 3-way sync)
# Stop hierarchy: gate-pass > store progress (bench_round / bench_refit / rev:sN) >
# fail_threshold session rotation > `gralph run --max-iterations N` (run-until-done.sh).
# Usage limits are absorbed OUTSIDE gralph by ./run-until-done.sh (never a GALP launcher).
# Models: impl/red/s0/audit = default tier; review/measure/benchmark = sonnet.

agent:
  command: ["claude", "-p", "{{prompt}}", "--dangerously-skip-permissions", "--add-dir", "D:/dev_ext/gpt-researcher", "--add-dir", "D:/dev_ext/gptr-mcp"]
  timeout: 75m

fail_threshold: 3
lua_timeout: 90s

commands:
  # ════════ s0 — benchmark harness + scorer (everything depends on this) ════════
  - name: s0-bench
    lua_timeout: 900s
    guidance: |
      [search-quality loop] Repos D:/dev_ext/gpt-researcher + D:/dev_ext/gptr-mcp (both on
      feature/search-quality). CWD = harness-search/. Test python: ../venv/Scripts/python.
      Spec: spec/search-quality.md — read it FIRST (metric definitions, golden schema,
      scorer contract). HARD RULES: never edit harness-search/scripts/* or no_read/evidence/*
      by hand; put a timeout on every shell command; commit only to feature/search-quality.

      Build the benchmark harness under bench/:
      1. bench/golden/*.json — >=5 golden sets per the spec schema. id "bun-rust-port" is
         MANDATORY, seeded from D:/dev_ext/gptr-mcp/outputs/how-did-bun-port-*.tree.json
         (meta.query verbatim) + session-confirmed facts; verify every fact/trap against a
         primary source and cite it in desc. Exactly 2 goldens get "measure_pair":true
         (one is bun-rust-port). Candidates for the other 4: the queries already run in
         D:/dev_ext/gptr-mcp/outputs/ (failure modes / denormalized DB / edge-AI face
         recognition / solid-state battery) — but respect the DIVERSITY FLOOR (spec
         "다양성 하한", gate field diversity_ok): per golden facts>=5, traps>=3,
         coverage_areas>=4, required_primary_domains>=2, contested>=1, a category from
         {recent-event, technical-deep-dive, market-landscape, contested-forecast,
         academic, encyclopedic-entity}; across the set >=4 distinct categories, >=2
         dated goldens (a fact matching 202[4-9]), measure_pair categories differ with
         >=1 dated member, >=6 distinct primary domains. Do NOT take both timeless
         deep-dive candidates (outbox + denormalized) — swap one for a dated/academic/
         encyclopedic query so the trap metric cannot pass vacuously.
      2. bench/score_report.py — DETERMINISTIC scorer per the spec CLI contract. NO LLM
         calls (llm_calls must be 0; any LLM SDK import fails the gate). Only network:
         S1 citation re-fetch, cached under --fetch-cache for idempotent re-scoring.
         Must also run without --tree (baseline reports have no tree.json).
      3. bench/fixtures/ — good_report.md/bad_report.md (+ optional good_tree.json/
         bad_tree.json) + fixture_golden.txt naming the golden id they score against.
         good must beat bad STRICTLY on S1,S2,S4,S5,S6 and be strictly LOWER on S3.
      4. Baseline (one-shot, then frozen): for EVERY golden query run a firecrawl
         multi-agent research (parallel sub-research + firecrawl search; FIRECRAWL_API_KEY
         is in D:/docker/gptr-mcp/.env), save bench/baseline_runs/<id>.md and
         <id>.sources.json, score each with score_report.py, then write
         bench/baseline_firecrawl.json = {"queries":{<id>:{S1_pct..S6_pct,report,scores}},
         "aggregate":{S1_pct..S6_pct}}.
      Preflight until ok=1: python scripts/bench_selfcheck.py
      (fields: golden_count>=5 golden_schema_ok=1 bun_first=1 measure_pairs=2
      diversity_ok=1 llm_calls=0 fixtures_passed=2 baseline_queries=golden_count).
      Then FREEZE:
      python scripts/freeze_bench.py  (writes bench/manifest.sha256 — after this commit,
      bench/golden/* and bench/baseline_firecrawl.json are READ-ONLY for the whole build;
      frozen_ok is re-checked by every later gate).
      COMMIT everything on feature/search-quality, message starting: [sq][s0]
      (tracked trees clean in BOTH repos).
      LOOP STATE IS OFF LIMITS: .gralph/** (state.json cursor, store.json counters,
      journal.jsonl) belongs to the framework. Never edit it, never rewind the cursor,
      never reset a round counter — round caps exist to hand a decision to a HUMAN, and
      they are counted from the append-only journal, so a store edit changes nothing
      except leaving evidence of tampering. Blocked by a cap? Stop and say so.
      Submit: gralph do s0-bench --report no_read/evidence/s0_bench.json
      {{usage}}
    args:
      - { name: report, required: true, desc: "path to s0_bench.json" }
    lua: scripts/s0_bench.lua
    next: [s1-red]

  # ════════ s1 — retriever recovery (defects 1+2) ════════
  - name: s1-red
    guidance: |
      [search-quality loop] Repos D:/dev_ext/gpt-researcher + D:/dev_ext/gptr-mcp (both on
      feature/search-quality). CWD = harness-search/. Test python: ../venv/Scripts/python.
      Spec: spec/search-quality.md s1. HARD RULES: bench/golden/* + baseline READ-ONLY
      (frozen_ok gate); no hand-edits under harness-search/; never delete/skip/weaken
      tests; timeout every shell command; commit only to feature/search-quality.

      Write FAILING (RED) pytest tests in ../tests/search_quality/s1/ — do NOT implement.
      Deterministic, no network (mock retriever HTTP + scraper). Cover the OBSERVED defects:
        (a) wikipedia language-code parsing bug ("wt" -> DNS fail) is normalized to a
            valid code
        (b) a tavily 432 response triggers fallback routing to another retriever instead
            of a silent total loss
        (c) a scrape pass returning 0 URLs increments a retriever/scraper error signal
            (it must not pass silently)
      Then RUN: python scripts/pytest_evidence.py --stage 1 --phase red
      Confirm collected>=1, errors=0, passed=0, failed>=1 (base_sha is recorded for review).
      LOOP STATE IS OFF LIMITS: .gralph/** (state.json cursor, store.json counters,
      journal.jsonl) belongs to the framework. Never edit it, never rewind the cursor,
      never reset a round counter — round caps exist to hand a decision to a HUMAN, and
      they are counted from the append-only journal, so a store edit changes nothing
      except leaving evidence of tampering. Blocked by a cap? Stop and say so.
      Submit: gralph do s1-red --report no_read/evidence/s1_red.json
      {{usage}}
    args:
      - { name: report, required: true, desc: "path to s1_red.json" }
    lua: scripts/s1_red.lua
    next: [s1-impl]

  - name: s1-impl
    lua_timeout: 900s
    guidance: |
      [search-quality loop] CWD = harness-search/. Spec: spec/search-quality.md s1.
      HARD RULES: RED test files in ../tests/search_quality/s1/ stay BYTE-UNCHANGED (the
      gate recomputes sha256 against the RED record); never delete/skip/weaken tests;
      bench/ frozen (frozen_ok); no hand-edits under harness-search/; timeout every
      command; container code is bind-mounted — live checks recreate it for you.

      Implement s1 until the tests are GREEN: fix the wikipedia language-code bug, add
      432/failure fallback routing, make 0-URL scrapes raise the error signal. IMPLEMENT
      ONLY — do not review your own work (the next node does that adversarially).
      ERROR-SIGNAL CONTRACT (spec s1, decided 2026-07-27): emit exactly one
      logger.error("SQ_RETRIEVAL_UNRECOVERED ...") when a query's retrieval ends with NO
      usable results. A failure a sibling retriever in the same bundle already covered is
      a logger.warning, NOT an error — the live gate counts only marker-carrying ERROR
      records (marker_wired proves the marker exists), so an error on a covered failure
      would make the gate depend on external service weather. Unit-test that the marker
      fires on total failure and does not fire when a fallback covers.
      If no_read/evidence/s1_review.json exists with blocking findings: fix EVERY blocking
      finding first, then write no_read/evidence/s1_impl_ack.json =
      {"addressed_findings":[<every blocking id>], "review_head_sha":"<the head_sha field
      COPIED FROM s1_review.json>"} — the gate cross-checks the ids AND that head_sha, so a
      leftover ack from an earlier round cannot satisfy a new finding by id collision.
      Preflight: python scripts/verify_impl.py --stage 1  (must print ok=1: hash_match,
      stage+full suite green, ruff_errors=0 on changed files, frozen_ok=1,
      review_addressed_ok=1). The gate re-runs this itself — you cannot submit around it.
      LOOP STATE IS OFF LIMITS: .gralph/** (state.json cursor, store.json counters,
      journal.jsonl) belongs to the framework. Never edit it, never rewind the cursor,
      never reset a round counter — round caps exist to hand a decision to a HUMAN, and
      they are counted from the append-only journal, so a store edit changes nothing
      except leaving evidence of tampering. Blocked by a cap? Stop and say so.
      Submit: gralph do s1-impl --report no_read/evidence/s1_impl.json
      {{usage}}
    args:
      - { name: report, required: true, desc: "path to s1_impl.json" }
    lua: scripts/s1_impl.lua
    next: [s1-review]

  - name: s1-review
    fail_threshold: 2
    agent:
      command: ["claude", "-p", "{{prompt}}", "--model", "sonnet", "--dangerously-skip-permissions", "--add-dir", "D:/dev_ext/gpt-researcher", "--add-dir", "D:/dev_ext/gptr-mcp"]
    guidance: |
      [search-quality loop] CWD = harness-search/. You are the ADVERSARIAL REVIEWER for s1.
      Your ONLY inputs: (1) the diff printed by `python scripts/review_diff.py --stage 1`,
      (2) the s1 completion conditions in spec/search-quality.md. You do NOT get the
      implementer's reasoning. ASSUME THE CODE IS WRONG and argue why: hunt for the
      defects the tests can't see — dead fallback paths, error signals that are counted
      but ignored, language-code normalization that breaks other languages, swallowed
      exceptions. DO NOT FIX CODE. DO NOT run implementation edits.
      Write no_read/evidence/s1_review.json =
      { "stage":1, "head_sha":"<git rev-parse HEAD of gpt-researcher>",
        "findings":[{"id":"R1","severity":"blocking"|"minor","file":"...","why":"..."}],
        "blocking_count":<N> }
      blocking_count>0 routes the flow BACK to s1-impl (max 3 rounds); 0 advances to
      s1-measure. head_sha must match the current HEAD (the gate recomputes it).
      LOOP STATE IS OFF LIMITS: .gralph/** (state.json cursor, store.json counters,
      journal.jsonl) belongs to the framework. Never edit it, never rewind the cursor,
      never reset a round counter — round caps exist to hand a decision to a HUMAN, and
      they are counted from the append-only journal, so a store edit changes nothing
      except leaving evidence of tampering. Blocked by a cap? Stop and say so.
      Submit: gralph do s1-review --report no_read/evidence/s1_review.json
      {{usage}}
    args:
      - { name: report, required: true, desc: "path to s1_review.json" }
    lua: scripts/s1_review.lua
    next: [s1-impl, s1-measure]

  - name: s1-measure
    fail_threshold: 2
    lua_timeout: 900s
    agent:
      command: ["claude", "-p", "{{prompt}}", "--model", "sonnet", "--dangerously-skip-permissions", "--add-dir", "D:/dev_ext/gpt-researcher", "--add-dir", "D:/dev_ext/gptr-mcp"]
      timeout: 180m
    guidance: |
      [search-quality loop] CWD = harness-search/. Live measure for s1 (retriever recovery).
      RUN: python scripts/measure.py --stage 1
      (acquires the live lock, force-recreates gptr-mcp-server, waits /health 200, then
      docker-execs container_probe_s1.py for ALL 5 golden queries and aggregates
      SQ_PROBE lines; stamps bench_round from the store; writes
      no_read/evidence/s1_measure.json).
      Gate thresholds: queries_run>=5 AND scraped_pages_min>=3 AND
      retriever_errors_total=0 AND context_chars_median>=20000.
      If unmet: the fix belongs in the IMPLEMENTATION (never in harness-search/scripts or
      evidence) — fix, keep `python scripts/verify_impl.py --stage 1` ok=1, re-run measure.
      When met, COMMIT everything on feature/search-quality with message starting
      [sq][s1] (tracked trees clean in BOTH repos; the gate verifies commit + frozen_ok).
      RUN IT IN THE FOREGROUND AND WAIT FOR IT TO EXIT. Live tree research takes
      30-90 minutes; the node timeout is sized for that. Your session ENDS the moment
      you stop emitting — there is no "I'll report when it finishes". Backgrounding
      the script orphans it: the loop then burns iteration after iteration against a
      locked container while nobody collects the result (measured, 8 iterations lost).
      Never use a background/detached run, never end your turn while it is running.
      FRESHNESS: the evidence records code_fp (content hash of gpt_researcher/**/*.py +
      gptr-mcp/server.py) and the gate RECOMPUTES it — if you touch the implementation
      after measuring, the gate rejects the evidence; just re-run the measure script
      (cached tree runs re-run live automatically once the fingerprint moves, so a fix
      is always scored against fresh artifacts, never the old run's).
      LOOP STATE IS OFF LIMITS: .gralph/** (state.json cursor, store.json counters,
      journal.jsonl) belongs to the framework. Never edit it, never rewind the cursor,
      never reset a round counter — round caps exist to hand a decision to a HUMAN, and
      they are counted from the append-only journal, so a store edit changes nothing
      except leaving evidence of tampering. Blocked by a cap? Stop and say so.
      Submit: gralph do s1-measure --report no_read/evidence/s1_measure.json
      {{usage}}
    args:
      - { name: report, required: true, desc: "path to s1_measure.json" }
    lua: scripts/s1_measure.lua
    next: [s2-red, s6-benchmark]

  # ════════ s2 — citation integrity (defect 6a) ════════
  - name: s2-red
    guidance: |
      [search-quality loop] Repos both on feature/search-quality. CWD = harness-search/.
      Spec: spec/search-quality.md s2. HARD RULES: bench/ frozen; no hand-edits under
      harness-search/; never delete/skip/weaken tests (s1 tests stay intact); timeout
      every command; commit only to feature/search-quality.

      Write FAILING (RED) pytest tests in ../tests/search_quality/s2/ — do NOT implement.
      Target: CitationAgent (gpt_researcher/skills/citation_verification.py, already used
      by deep_research) wired into the TREE path (gpt_researcher/skills/tree_research.py).
      Cover (mock scrape/LLM, deterministic):
        (a) node.sources is narrowed to documents actually read AND quoted in the node
            answer — a retriever-returned-but-unused URL does not survive
        (b) a report [id] with no citations-map entry is detected (uncited id)
        (c) CitationAgent verification runs over tree node claims and flags unverified
      Then RUN: python scripts/pytest_evidence.py --stage 2 --phase red
      LOOP STATE IS OFF LIMITS: .gralph/** (state.json cursor, store.json counters,
      journal.jsonl) belongs to the framework. Never edit it, never rewind the cursor,
      never reset a round counter — round caps exist to hand a decision to a HUMAN, and
      they are counted from the append-only journal, so a store edit changes nothing
      except leaving evidence of tampering. Blocked by a cap? Stop and say so.
      Submit: gralph do s2-red --report no_read/evidence/s2_red.json
      {{usage}}
    args:
      - { name: report, required: true, desc: "path to s2_red.json" }
    lua: scripts/s2_red.lua
    next: [s2-impl]

  - name: s2-impl
    lua_timeout: 900s
    guidance: |
      [search-quality loop] CWD = harness-search/. Spec: spec/search-quality.md s2.
      HARD RULES: RED tests byte-unchanged; never delete/skip/weaken tests; bench/ frozen;
      no hand-edits under harness-search/; timeout every command.

      Implement s2 until GREEN: wire CitationAgent into tree_research.py, narrow
      node.sources to actually-read-and-cited documents, make uncited [id]s impossible
      (fail-closed). IMPLEMENT ONLY — no self-review.
      If no_read/evidence/s2_review.json has blocking findings: fix EVERY one, then write
      no_read/evidence/s2_impl_ack.json = {"addressed_findings":[<ids>],
      "review_head_sha":"<head_sha COPIED FROM s2_review.json>"} — the gate checks
