      Preflight: python scripts/verify_impl.py --stage 2 (ok=1; the gate re-runs it).
      LOOP STATE IS OFF LIMITS: .gralph/** (state.json cursor, store.json counters,
      journal.jsonl) belongs to the framework. Never edit it, never rewind the cursor,
      never reset a round counter — round caps exist to hand a decision to a HUMAN, and
      they are counted from the append-only journal, so a store edit changes nothing
      except leaving evidence of tampering. Blocked by a cap? Stop and say so.
      Submit: gralph do s2-impl --report no_read/evidence/s2_impl.json
      {{usage}}
    args:
      - { name: report, required: true, desc: "path to s2_impl.json" }
    lua: scripts/s2_impl.lua
    next: [s2-review]

  - name: s2-review
    fail_threshold: 2
    agent:
      command: ["claude", "-p", "{{prompt}}", "--model", "sonnet", "--dangerously-skip-permissions", "--add-dir", "D:/dev_ext/gpt-researcher", "--add-dir", "D:/dev_ext/gptr-mcp"]
    guidance: |
      [search-quality loop] CWD = harness-search/. ADVERSARIAL REVIEWER for s2. Inputs
      ONLY: `python scripts/review_diff.py --stage 2` + spec/search-quality.md s2
      conditions. ASSUME THE CODE IS WRONG: does the citation narrowing actually depend
      on what was QUOTED, or just on what was fetched? Can an uncited [id] still slip
      through a formatting variant? Is CitationAgent actually invoked on the tree path or
      only imported? DO NOT FIX CODE.
      Write no_read/evidence/s2_review.json = { "stage":2, "head_sha":"<HEAD>",
      "findings":[{"id","severity","file","why"}], "blocking_count":<N> }.
      LOOP STATE IS OFF LIMITS: .gralph/** (state.json cursor, store.json counters,
      journal.jsonl) belongs to the framework. Never edit it, never rewind the cursor,
      never reset a round counter — round caps exist to hand a decision to a HUMAN, and
      they are counted from the append-only journal, so a store edit changes nothing
      except leaving evidence of tampering. Blocked by a cap? Stop and say so.
      Submit: gralph do s2-review --report no_read/evidence/s2_review.json
      {{usage}}
    args:
      - { name: report, required: true, desc: "path to s2_review.json" }
    lua: scripts/s2_review.lua
    next: [s2-impl, s2-measure]

  - name: s2-measure
    fail_threshold: 2
    lua_timeout: 900s
    agent:
      command: ["claude", "-p", "{{prompt}}", "--model", "sonnet", "--dangerously-skip-permissions", "--add-dir", "D:/dev_ext/gpt-researcher", "--add-dir", "D:/dev_ext/gptr-mcp"]
      timeout: 180m
    guidance: |
      [search-quality loop] CWD = harness-search/. Live measure for s2 (citation integrity).
      RUN: python scripts/measure.py --stage 2
      (recreate + health, deep_tree_research for the 2 measure_pair goldens — LONG calls,
      round-cached so re-runs only redo failures — scores each with the frozen scorer,
      stamps bench_round, writes no_read/evidence/s2_measure.json).
      Gate thresholds: queries_run>=2 AND S1_min_pct>=80 AND uncited_ids_total=0.
      If unmet: fix the implementation (never harness scripts/evidence), keep
      verify_impl --stage 2 ok=1, re-run measure. Then COMMIT [sq][s2] (both repos clean).
      RUN IT IN THE FOREGROUND AND WAIT FOR IT TO EXIT. Live tree research takes
      30-90 minutes; the node timeout is sized for that. Your session ENDS the moment
      you stop emitting — there is no "I'll report when it finishes". Backgrounding
      the script orphans it: the loop then burns iteration after iteration against a
      locked container while nobody collects the result (measured, 8 iterations lost).
      Never use a background/detached run, never end your turn while it is running.
      FRESHNESS: the evidence records code_fp (content hash of gpt_researcher/**/*.py +
      gptr-mcp/server.py) and the gate RECOMPUTES it — if you touch the implementation
      after measuring, the gate rejects the evidence; just re-run the measure script
      (cached tree runs re-run live automatically once the fingerprint moves, so a fix
      is always scored against fresh artifacts, never the old run's).
      LOOP STATE IS OFF LIMITS: .gralph/** (state.json cursor, store.json counters,
      journal.jsonl) belongs to the framework. Never edit it, never rewind the cursor,
      never reset a round counter — round caps exist to hand a decision to a HUMAN, and
      they are counted from the append-only journal, so a store edit changes nothing
      except leaving evidence of tampering. Blocked by a cap? Stop and say so.
      Submit: gralph do s2-measure --report no_read/evidence/s2_measure.json
      {{usage}}
    args:
      - { name: report, required: true, desc: "path to s2_measure.json" }
    lua: scripts/s2_measure.lua
    next: [s3-red, s6-benchmark]

  # ════════ s3 — empty-context fail-closed (defect 3) ════════
  - name: s3-red
    guidance: |
      [search-quality loop] Repos both on feature/search-quality. CWD = harness-search/.
      Spec: spec/search-quality.md s3. HARD RULES: bench/ frozen; no hand-edits under
      harness-search/; never delete/skip/weaken tests (s1-s2 intact); timeout every
      command.

      Write FAILING (RED) pytest tests in ../tests/search_quality/s3/ — do NOT implement.
      Target: gpt_researcher/skills/tree_research.py node lifecycle. THIS IS THE
      UNIT-LEVEL PROOF the user demanded (agent self-report forbidden). Cover
      (mock research, deterministic):
        (a) a node whose research returns 0 scraped docs / context below the threshold
            transitions to NodeStatus.FAILED — NOT ANSWERED
        (b) a FAILED node's text is excluded from post-order synthesis/rollup
        (c) an ANSWERED node with real context is unaffected (no regression)
      Then RUN: python scripts/pytest_evidence.py --stage 3 --phase red
      LOOP STATE IS OFF LIMITS: .gralph/** (state.json cursor, store.json counters,
      journal.jsonl) belongs to the framework. Never edit it, never rewind the cursor,
      never reset a round counter — round caps exist to hand a decision to a HUMAN, and
