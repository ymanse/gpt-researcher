    lua: scripts/s3_red.lua
    next: [s3-impl]

  - name: s3-impl
    lua_timeout: 900s
    guidance: |
      [search-quality loop] CWD = harness-search/. Spec: spec/search-quality.md s3.
      HARD RULES: RED tests byte-unchanged; never delete/skip/weaken tests; bench/ frozen;
      no hand-edits under harness-search/; timeout every command.

      Implement s3 until GREEN: empty-scrape / below-threshold-context nodes become
      FAILED (not ANSWERED, no prior-knowledge answers), FAILED nodes stay out of
      rollup/synthesis. IMPLEMENT ONLY.
      If no_read/evidence/s3_review.json has blocking findings: fix EVERY one, then write
      no_read/evidence/s3_impl_ack.json = {"addressed_findings":[<ids>],
      "review_head_sha":"<head_sha COPIED FROM s3_review.json>"} — the gate checks
      both, so a leftover ack from an earlier round cannot satisfy a new finding.
      Preflight: python scripts/verify_impl.py --stage 3 (ok=1; gate re-runs it).
      LOOP STATE IS OFF LIMITS: .gralph/** (state.json cursor, store.json counters,
      journal.jsonl) belongs to the framework. Never edit it, never rewind the cursor,
