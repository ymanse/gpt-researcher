    lua: scripts/s3_impl.lua
    next: [s3-review]

  - name: s3-review
    fail_threshold: 2
    agent:
      command: ["claude", "-p", "{{prompt}}", "--model", "sonnet", "--dangerously-skip-permissions", "--add-dir", "D:/dev_ext/gpt-researcher", "--add-dir", "D:/dev_ext/gptr-mcp"]
    guidance: |
      [search-quality loop] CWD = harness-search/. ADVERSARIAL REVIEWER for s3. Inputs
      ONLY: `python scripts/review_diff.py --stage 3` + spec s3 conditions. ASSUME WRONG:
      is the context threshold measured on the REAL research context or a proxy that can
      be non-empty while research failed? Can a FAILED node's text still leak into the
